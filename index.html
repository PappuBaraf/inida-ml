    <!-- Defensive shims for browser extensions & devtools inspectors -->
    <script>
      (function() {
        // 1. Filter out extension error events
        window.addEventListener('error', function(event) {
          if (event.filename && event.filename.includes('chrome-extension://')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
          if (event.message && event.message.includes('Cannot set property fetch')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        // 2. Ensure window.fetch has both a getter and setter so inspector scripts can wrap it
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = typeof fn === 'function' ? fn : originalFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If already defined or non-configurable, fallback silently
        }
      })();
    </script>
